name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # her gün bir kez günceller
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a77fd6&color_dots=#ebedf0,#f3d3e2,#e8a6c1,#b06a9a,#7a3f74
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c9b6f2&color_dots=#1c1622,#4a2a45,#7a3f74,#b06a9a,#e8a6c1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
